name: personal-agent

services:
  go2rtc:
    image: ghcr.io/alexxit/go2rtc:1.9.14@sha256:675c318b23c06fd862a61d262240c9a63436b4050d177ffc68a32710d9e05bae
    container_name: personal-agent-go2rtc
    network_mode: host
    restart: unless-stopped
    user: "${GO2RTC_UID:-1000}:${GO2RTC_GID:-1000}"
    environment:
      TZ: "${GO2RTC_TIMEZONE:-Asia/Shanghai}"
    volumes:
      - type: bind
        source: ./state/go2rtc
        target: /config
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8553/api"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
