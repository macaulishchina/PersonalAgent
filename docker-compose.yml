name: personal-agent

services:
  go2rtc:
    image: ghcr.io/sincerexia/xiaomi-onvif:0.1.0-beta.2@sha256:8fb5bcb9cbf02c24678fae3d272f35c4b0ddb91b1f4dd4d6a0fbe929b48b8ac8
    container_name: personal-agent-go2rtc
    network_mode: host
    restart: unless-stopped
    user: "${GO2RTC_UID:-1000}:${GO2RTC_GID:-1000}"
    environment:
      TZ: "${GO2RTC_TIMEZONE:-Asia/Shanghai}"
    volumes:
      - type: bind
        source: ./state/go2rtc
        target: /config
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8553/api"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
