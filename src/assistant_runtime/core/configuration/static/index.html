<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>系统配置</title><link rel="stylesheet" href="/console.css"></head>
<body><main><header><div><small>PERSONAL AGENT</small><h1>系统配置</h1></div><div class="header-actions"><button id="password-open" class="subtle" hidden>修改密码</button><button id="refresh">重新加载</button></div></header><p id="notice" role="status" aria-live="polite"></p>
<form id="login"><h2>管理员登录</h2><label>管理员口令<input id="token" type="password" autocomplete="current-password" required></label><button>登录</button></form>
<form id="password-change" hidden><h2>修改管理员密码</h2><p class="hint">立即生效，所有设备需要重新登录，无需重启业务服务。</p><p id="password-policy" class="hint"></p><label>当前密码<input id="current-password" type="password" autocomplete="current-password" required></label><label>新密码<input id="new-password" type="password" autocomplete="new-password" required></label><label>再次输入新密码<input id="confirm-password" type="password" autocomplete="new-password" required></label><button id="password-save">保存新密码</button><button id="password-cancel" class="subtle" type="button">取消</button></form>
<section id="editor" hidden><div class="summary"><strong id="state"></strong><span>保存后需要重启业务服务才会生效。</span></div><p id="health"></p><div id="diagnostics" role="status"></div><section class="application"><h2>应用已保存的配置</h2><p>等待模式暂停接收新工作；已接受的工作仍可补充、回答或取消。终止模式会取消当前工作，无法确认的结果保留为未知。</p><button id="apply-wait">等待完成后重启</button> <button id="apply-force" class="subtle">终止并重启</button> <button id="abort-apply" class="subtle">撤销等待</button><p id="application-state" aria-live="polite"></p><ul id="blockers"></ul></section><div class="workspace"><nav id="navigation" aria-label="配置分类"></nav><div id="documents"></div></div><footer><span id="count"></span><button id="save">校验并保存</button><button id="history">变更记录</button></footer><div id="versions"></div></section><button id="repair-open" class="subtle">配置损坏？进入修复</button><section id="repair" hidden></section>
</main><script src="/console.js" defer></script></body></html>
