# Candidate fragment INSIDE the existing TLS server. Not automatically deployed.
# Replace pa-host:8047 with the reachable PA management address.
# Trust only this proxy's actual source address in PA management.toml.
location = /pa/passport/pair {
    proxy_pass http://pa-host:8047/entrances/ai_passport/pair;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Host $http_host;
    proxy_buffering off;
    proxy_read_timeout 30s;
    client_max_body_size 4k;
    access_log off;
}
location = /pa/passport/stream {
    proxy_pass http://pa-host:8047/entrances/ai_passport/stream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Host $http_host;
    proxy_buffering off;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
    access_log off;
}
# Do not expose /api, /login or any other management route at this site.
