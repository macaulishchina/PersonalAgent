<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>会话快捷链接 · Personal Agent</title>
    <link rel="stylesheet" href="/console.css" />
    <link rel="stylesheet" href="./chat-links.css" />
    <script src="./chat-links.js" defer></script>
  </head>
  <body>
    <main class="links-page">
      <a class="back-link" href="/config/">← 返回系统配置</a>
      <div class="page-heading">
        <div>
          <h1>会话快捷链接</h1>
          <p>免输入口令打开指定会话。权限仅限此会话，链接可以随时撤销。</p>
        </div>
      </div>
      <p class="page-status" id="status" role="status" aria-live="polite">
        正在读取…
      </p>
      <p id="login-help" hidden>
        请先<a href="/config/">登录系统配置</a>，再返回此页刷新。
      </p>
      <section id="management" hidden>
        <nav class="links-nav" aria-label="访问管理">
          <a href="#fixed-entrances">固定入口</a>
          <a href="#active-accesses">当前授权</a>
          <a href="#shortcut-links">快捷链接</a>
        </nav>
        <section
          class="links-panel"
          id="fixed-entrances"
          aria-labelledby="fixed-title"
        >
          <header>
            <h2 id="fixed-title">固定访问入口</h2>
            <p>
              入口提供“申请访问”和“登录进入”。批准端点由接入插件提供，临时时长由批准端决定。
            </p>
          </header>
          <form id="create-entrance" class="links-form">
            <div class="link-field">
              <label for="entrance-session">目标会话</label
              ><select id="entrance-session" required></select>
            </div>
            <div class="link-field">
              <label for="entrance-title">公开显示名称</label
              ><input
                id="entrance-title"
                maxlength="120"
                required
                value="对话入口"
              />
            </div>
            <div class="link-field">
              <label for="endpoint">批准端点</label
              ><input
                id="endpoint"
                maxlength="128"
                required
                placeholder="例如 terminal:device-id"
              />
            </div>
            <div class="link-field">
              <label for="entrance-permission">临时访问权限</label
              ><select id="entrance-permission">
                <option value="chat">查看并继续聊天</option>
                <option value="read">仅查看</option>
              </select>
            </div>
            <button class="primary" type="submit">创建固定入口</button>
            <div id="entrance-created" hidden>
              <div class="link-field">
                <label for="entrance-url">固定入口地址</label
                ><input id="entrance-url" readonly />
              </div>
              <a id="open-entrance" target="_blank" rel="noreferrer noopener"
                >打开入口</a
              >
            </div>
          </form>
          <h3>已登记入口</h3>
          <div class="links-list" id="entrances"></div>
        </section>
        <section
          class="links-panel"
          id="active-accesses"
          aria-labelledby="access-title"
        >
          <header class="links-panel-toolbar">
            <div>
              <h2 id="access-title">当前授权访问</h2>
              <p>
                关闭访问会断开网页连接，已经接受的工作继续执行。有效账号仍可重新登录。
              </p>
            </div>
            <button type="button" id="refresh-accesses">刷新访问列表</button>
          </header>
          <div class="links-list" id="accesses"></div>
        </section>
        <section
          class="links-panel"
          id="shortcut-links"
          aria-labelledby="shortcut-title"
        >
          <header>
            <h2 id="shortcut-title">快捷链接</h2>
            <p>为指定会话生成一个可撤销的访问链接。</p>
          </header>
          <form id="create-link" class="links-form">
            <div class="link-field">
              <label for="session">目标会话</label
              ><select id="session" required></select>
            </div>
            <button type="button" id="older" hidden>加载更早会话</button>
            <div class="link-field">
              <label for="permission">访问权限</label>
              <select id="permission">
                <option value="chat">查看并继续聊天</option>
                <option value="read">仅查看</option>
              </select>
            </div>
            <div class="link-field">
              <label for="expiry">链接有效期</label>
              <select id="expiry">
                <option value="2592000">30 天</option>
                <option value="7776000">90 天</option>
                <option value="0">直到手动撤销</option>
              </select>
            </div>
            <button class="primary" type="submit">生成链接</button>
            <div id="created" hidden>
              <div class="link-field">
                <label for="link">新链接（仅此时显示，请保存）</label>
                <input id="link" readonly />
              </div>
              <a id="open-link" target="_blank" rel="noreferrer noopener"
                >打开对话验证</a
              >
              <p>
                持有完整链接的人可以获得上述权限，请勿公开分享。浏览器登录最长保留
                7 天，可再次打开原链接进入。
              </p>
            </div>
          </form>
          <details>
            <summary>新建独立空会话</summary>
            <form id="create-session" class="links-form">
              <div class="link-field">
                <label for="title">会话名称</label
                ><input
                  id="title"
                  maxlength="120"
                  required
                  placeholder="例如：快捷入口验证"
                />
              </div>
              <button type="submit">新建并选中</button>
            </form>
          </details>
          <h3>已有链接</h3>
          <div class="links-list" id="links"></div>
        </section>
      </section>
    </main>
  </body>
</html>
