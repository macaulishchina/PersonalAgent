# 后台任务：未指定模型/深度时跟随主对话；推荐项可为空。
[tasks]
max_goal_rounds = 8
timezone = "Asia/Shanghai"
concurrency = 4
misfire_seconds = 300

[tasks.execution]
model = "auto" # 跟随主对话模型；显式配置会约束所有任务
reasoning_effort = "auto" # 沿用主对话具体深度；主对话也是 auto 时由发起模型选择

[tasks.model_policy]
review_mode = "shadow" # off/shadow/active；decisions 为可选插件
max_upgrades = 1 # 有检查点的显式交接；失败不换模型

[tasks.model_policy.recommendations]
# 自定义 ID 不代表档位顺序。模型必须先登记在 model_api.entries。
# [tasks.model_policy.recommendations.diagnosis]
# name = "复杂诊断"
# model = "your-model-alias"
# reasoning_effort = "high"
# reason = "适合多假设分析和冲突证据推理"
# description = "根因未明、需要比较多个解释并逐项验证时使用"

[work_files]
retention_days = 7
