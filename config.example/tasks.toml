# 后台任务并发、模型四档、升级规则、工作文件和通知。

[tasks]
max_goal_rounds = 8 # 同一长期目标单轮任务内有限续跑，不重置调用预算
timezone = "Asia/Shanghai"
concurrency = 4
misfire_seconds = 300

[tasks.execution]
model = "auto"
reasoning_effort = "auto"

[tasks.model_policy]
review_mode = "active"
default_profile = "fast"
max_upgrades = 1

[tasks.model_policy.profiles.fast]
model = "go-gpt"
reasoning_effort = "low"
[tasks.model_policy.profiles.balanced]
model = "go-gpt"
reasoning_effort = "medium"
[tasks.model_policy.profiles.deep]
model = "go-gpt"
reasoning_effort = "high"
[tasks.model_policy.profiles.ultra]
model = "go-gpt"
reasoning_effort = "max"
[tasks.model_policy.fallbacks]
go-gpt = [{model="go-claude", reasoning_effort="medium"}, {model="deepseek-assist", reasoning_effort="high"}]
go-claude = [{model="go-gpt", reasoning_effort="medium"}, {model="deepseek-assist", reasoning_effort="high"}]
deepseek-assist = [{model="go-gpt", reasoning_effort="medium"}, {model="go-claude", reasoning_effort="medium"}]

[work_files]
retention_days = 7
