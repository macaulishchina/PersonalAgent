# 后台任务并发、模型四档、升级规则、工作文件和通知。

[tasks]
timezone = "Asia/Shanghai"
concurrency = 2
misfire_seconds = 300

[tasks.execution]
model = "auto"
reasoning_effort = "auto"

[tasks.model_policy]
# Observe evidence-based recommendations; never overrides the selected model.
review_mode = "shadow"
default_profile = "fast"
max_upgrades = 1

[tasks.model_policy.profiles]

[tasks.model_policy.profiles.fast]
model = "gpt-6-luna"
reasoning_effort = "low"

[tasks.model_policy.profiles.balanced]
model = "gpt-6.1-sol"
reasoning_effort = "low"

[tasks.model_policy.profiles.deep]
model = "gpt-6.1-sol"
reasoning_effort = "medium"

[tasks.model_policy.profiles.ultra]
model = "gpt-6-astra"
reasoning_effort = "high"

# 可选：主模型明确失败且确认没有执行动作时，按顺序切换。
# [tasks.model_policy.fallbacks]
# gpt-6-luna = [{ model = "deepseek-assist", reasoning_effort = "none" }]
# 实际模型别名和能力须在 models.toml 配置、启用并完成验收。

[work_files]
retention_days = 7

[notifications]
channels = ["chat", "context"]
voice_enabled = true
voice_spacing_seconds = 60
max_attempts = 5
retry_seconds = 5
delivery_timeout = 45
max_notifications = 10000
