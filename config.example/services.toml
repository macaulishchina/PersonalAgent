# Web、Apple Home、事件服务及第三方 MCP 接入设置。
# 在入口 plugins 中启用对应插件后再填写这些示例。
# [web]
# enable = true
# host = "127.0.0.1"
# port = 8046
# [events]
# quota_bytes = 2147483648
# queue_size = 128
# query_seconds = 2.0
# [apple_home]
# host = "192.168.1.10"
# port = 8047
# hap_port = 51827
# poll_seconds = 60
# refresh_timeout = 6

[external_mcp]
max_servers = 32
inherit_user_servers = false
