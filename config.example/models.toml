# Choose a model route explicitly before inference; no paid provider is enabled by default.
[model_api]
enabled = false
# Single-call output limits default to 0: use supplier/Pi defaults, not a token budget.
# max_output_tokens = 0
# execution_max_output_tokens = 0
# Context maintenance has a separate deadline; ordinary inference keeps its own timeout.
timeout_seconds = 600
compaction_timeout_seconds = 600
# Long tool text is stored privately with a bounded preview and file reference.
tool_result_max_chars = 6000
# Maximum discovered MCP tools declared per model request; native tools are separate.
max_loaded_tools = 12
# Native account example: configure an account/provider/model, set main_model,
# enable model_api and finish operator login. All routes use the installed Pi provider adapter.
# API route examples and accepted capability declarations: core/models/README.md.
