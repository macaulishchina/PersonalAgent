# Project-specific Codex task model; does not change ~/.codex/config.toml.
codex_model = "gpt-6.1-sol"
codex_reasoning_effort = "high"
# Independent silent Mem0 inference, using the same ChatGPT subscription login.
memory_model = "gpt-6-luna"
memory_reasoning_effort = "low"
# Hardware-free starting point; change to voice after configuring real devices.
profile = "headless"
assistant_name = "个人助理"
realtime_voice = "cove"
wake_words = ["嘟嘟", "你好嘟嘟"]
idle_seconds = 60
# Short requests by default; explicitly ask to chat for continuous conversation.
voice_follow_up_seconds = 8
minimum_volume = 80
# Optional daily silence: suppress keyword/gesture wake and all voice feedback.
# Background tasks keep running. At end, standby resumes; it does not speak.
# quiet_hours = {enable = true, start = "23:00", end = "07:00", timezone = "Asia/Shanghai"}
# Set enable = false to disable silence while retaining the schedule.
# Optional shared chat: voice profile, add "web" to plugins, build frontend first.
# web = {enable = true, host = "127.0.0.1", port = 8046}
# Optional recording: install events extra and add "events" to plugins.
# For managed source collection also add "observations"; Reyee requires the reyee extra.
# Source config: .agents/observations/sources.json; credentials: state/observations/.
# Event records: state/events/. No global polling; each producer chooses its acquisition.
# events = {quota_bytes = 2147483648, queue_size = 128, query_seconds = 2.0}
# Optional Apple Home sensor source: install apple-home extra, add apple_home to plugins.
# Use an explicit reachable LAN IP; pair the virtual bridge and configure Home automation.
# apple_home = {host = "192.168.1.10", port = 8047, hap_port = 51827, poll_seconds = 60, refresh_timeout = 6}
# For authorized format diagnosis only: add log_invalid_values = true to apple_home.
# Logs bounded previews of rejected known sensor fields; disable after diagnosis.
memory_enabled = true
memory_auto_capture = true
# root = "/absolute/path/to/instance"
# workspace = "/absolute/path/to/your/workspace"
# model_dir = "/absolute/path/to/wake-models"
# Fixed main voice endpoints for the entire process; change config and restart.
# Extra devices remain tool endpoints and never replace these bindings at runtime.
# input_device = "office_microphone"
# default_output = "office_speaker"
# [devices.office_microphone]
# adapter = "pipewire"
# kind = "microphone"
# label = "书房麦克风"
# location = "书房"
# [devices.office_microphone.connection]
# match = "stable USB microphone identity"
# [devices.office_speaker]
# adapter = "pipewire"
# kind = "speaker"
# label = "书房音箱"
# location = "书房"
# [devices.office_speaker.connection]
# address = "AA:BB:CC:DD:EE:FF"  # or sink = "exact PipeWire sink name"

# Optional AirPlay receiver: install the airplay extra and add airplay to plugins.
# [devices.homepod]
# adapter = "airplay"
# kind = "speaker"
# label = "HomePod"
# location = "客厅"
# physical_id = "living_homepod"  # shared with the sensor endpoint below
# max_age_seconds = 45
# [devices.homepod.connection]
# host = "192.168.1.50"
# identifier = "discovered-raop-identifier"
# timing_port = 49160
# control_port = 49161

# Optional sensor endpoint of the same HomePod; not provided by AirPlay.
# [devices.homepod_environment]
# adapter = "apple_home"
# kind = "sensor"
# label = "HomePod 温湿度"
# location = "客厅"
# physical_id = "living_homepod"
# max_age_seconds = 180
# [devices.homepod_environment.connection]
# metrics = ["temperature", "humidity"]
# trigger_name = "读取HomePod温湿度"

# Optional video gateway: install camera extra, add go2rtc to plugins. Audio is separate.
# [devices.office_camera]
# adapter = "go2rtc"
# kind = "camera"
# label = "书房摄像头"
# location = "书房"
# [devices.office_camera.connection]
# base_url = "http://127.0.0.1:8553"
# stream = "office_camera"
# timeout_seconds = 8

# Optional durable background tasks: install tasks extra and add "tasks" to plugins.
[tasks]
timezone = "Asia/Shanghai"
concurrency = 2
misfire_seconds = 300
[tasks.execution]
# auto: initiating model chooses a policy profile or concrete values with a reason.
# Missing choices use the fast profile, never inherit foreground/parent settings.
# Fixed values here override task-level suggestions; never modifies global Codex config.
model = "auto"
reasoning_effort = "auto"
[tasks.model_policy]
default_profile = "fast"
max_upgrades = 1
[tasks.model_policy.profiles.fast]
model = "gpt-6-luna"
reasoning_effort = "low"
[tasks.model_policy.profiles.balanced]
model = "gpt-6.1-sol"
reasoning_effort = "low"
[tasks.model_policy.profiles.deep]
model = "gpt-6.1-sol"
reasoning_effort = "medium"
[work_files]
retention_days = 7
# root = "/absolute/private/instance/work"

# Enable "notifications" in plugins; required by tasks. Phone push is not installed.
[notifications]
channels = ["chat", "context"]
voice_enabled = true
voice_spacing_seconds = 60
max_attempts = 5
retry_seconds = 5
delivery_timeout = 45
max_notifications = 10000

# Third-party MCP manager; add "integrations" to an explicit plugins list.
[external_mcp]
max_servers = 32
inherit_user_servers = false
# Non-secret definitions in .agents/mcp/servers.json belong in Git.
# Credentials use environment references; runtime files remain in ignored state/.
# registry_path = "/absolute/private/path/servers.json"

# Optional Media MCP: install media extra; enable media alongside notifications.
# Search service: deploy/media.compose.yaml. Aliyun/OpenList auth stays under state/media/credentials/.
# Run scripts/prepare_media.py for actual stable destination IDs, never guess them.
