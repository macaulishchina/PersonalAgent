# Project-specific Codex task model; does not change ~/.codex/config.toml.
codex_model = "gpt-6.1-sol"
codex_reasoning_effort = "high"
# Independent silent Mem0 inference, using the same ChatGPT subscription login.
memory_model = "gpt-6-luna"
memory_reasoning_effort = "low"
# Hardware-free starting point; change to voice after configuring real devices.
profile = "headless"
assistant_name = "个人助理"
realtime_voice = "cove"
wake_words = ["嘟嘟", "你好嘟嘟"]
idle_seconds = 60
minimum_volume = 80
# Optional daily silence: suppress keyword/gesture wake and all voice feedback.
# Background tasks keep running. At end, standby resumes; it does not speak.
# quiet_hours = {enable = true, start = "23:00", end = "07:00", timezone = "Asia/Shanghai"}
# Set enable = false to disable silence while retaining the schedule.
memory_enabled = true
memory_auto_capture = true
# root = "/absolute/path/to/instance"
# workspace = "/absolute/path/to/your/workspace"
# model_dir = "/absolute/path/to/wake-models"
