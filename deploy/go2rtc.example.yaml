# Copy to state/go2rtc/go2rtc.yaml and replace the password before starting.
# Keep Xiaomi account tokens and stream credentials in that private file only.
api:
  listen: 0.0.0.0:8553
  username: admin
  password: CHANGE_ME_BEFORE_STARTING
  # SSH forwarding and the local health check use trusted loopback access.
  local_auth: false
rtsp:
  listen: 0.0.0.0:8554
  username: admin
  password: CHANGE_ME_BEFORE_STARTING
webrtc:
  listen: 0.0.0.0:8555
log:
  level: warn
# The Web UI writes the streams block when adding the first camera.
# Do not initialize it as an inline empty mapping: go2rtc 1.9.14 cannot patch it.
