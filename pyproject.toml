[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dell-voice-assistant"
version = "0.1.0"
description = "Personal always-on voice interface to local Codex"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26", "sherpa-onnx>=1.12", "soxr>=0.5", "miniaudio>=1.61", "pypinyin>=0.55", "aiortc>=1.15,<2", "pywebrtc-audio==0.2.0", "playwright==1.63.0", "aiohttp>=3.14,<4"]

[project.scripts]
dell-voice = "dell_voice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
dell_voice = ["*.js"]
