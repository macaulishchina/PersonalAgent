[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-agent"
version = "0.2.0"
description = "Extensible personal assistant runtime for Linux"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
voice = ["numpy>=1.26", "sherpa-onnx==1.13.8", "sherpa-onnx-core==1.13.8", "soxr>=0.5", "miniaudio>=1.61", "onnxruntime==1.31.0", "kaldi-native-fbank==1.22.3", "pywebrtc-audio==0.2.0", "playwright==1.63.0", "aiohttp>=3.14,<4"]
airplay = ["pyatv==0.18.0", "imageio-ffmpeg==0.6.0"]
camera = ["imageio-ffmpeg==0.6.0", "pillow>=12,<13"]
memory = ["basic-memory==0.23.0"]
dev = ["ruff==0.14.0", "mypy==1.18.2"]

[project.scripts]
personal-agent = "assistant_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"assistant_runtime.plugins.codex" = ["*.js"]
"assistant_runtime.plugins.keyword" = ["FUNASR_LICENSE.txt"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src/assistant_runtime/kernel"]

[tool.uv]
prerelease = "allow"
