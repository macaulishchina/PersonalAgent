[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-agent"
dynamic = ["version"]
description = "Extensible personal assistant runtime for Linux and Windows"
requires-python = ">=3.12,<3.13"
dependencies = ["packaging>=24,<27", "portalocker>=3.2,<4", "pywin32>=311; sys_platform == 'win32'", "tzdata>=2025.2; sys_platform == 'win32'"]

[project.optional-dependencies]
core = [
    "aiohttp>=3.14,<4", "pillow>=12,<13", "jsonschema>=4.23,<5", "tomlkit==0.13.3",
    "python-dotenv>=1.2,<2", "fastmcp==4.0.0b1", "APScheduler==3.11.0",
    "fastembed==0.9.0", "mcp==2.3.0", "mem0ai==1.0.11",
]
slim = ["personal-agent[core]"]
standard = ["personal-agent[core,web]"]
voice = ["numpy>=1.26", "sherpa-onnx==1.13.8", "sherpa-onnx-core==1.13.8", "soxr>=0.5", "miniaudio>=1.61", "onnxruntime==1.31.0", "kaldi-native-fbank==1.22.3", "pywebrtc-audio==0.2.0; sys_platform == 'linux'", "playwright==1.63.0", "aiohttp>=3.14,<4"]
tasks = ["APScheduler==3.11.0", "fastmcp==4.0.0b1"]
events = ["fastmcp==4.0.0b1"]
models = ["aiohttp>=3.14,<4", "python-dotenv>=1.2,<2", "fastmcp==4.0.0b1", "jsonschema>=4.23,<5", "pillow>=12,<13"]
decisions = ["aiohttp>=3.14,<4", "python-dotenv>=1.2,<2"]
media = ["aligo==6.2.8", "aiohttp>=3.14,<4", "fastmcp==4.0.0b1"]
reyee = ["aiohttp>=3.14,<4", "cryptography>=46,<51"]
integrations = ["fastmcp==4.0.0b1"]
web = ["aiohttp>=3.14,<4", "pillow>=12,<13"]
airplay = ["pyatv==0.18.0", "imageio-ffmpeg==0.6.0"]
apple-home = ["HAP-python==5.0.0", "aiohttp>=3.14,<4"]
windows-devices = ["miniaudio==1.71; sys_platform == 'win32'", "pycaw==20260927; sys_platform == 'win32'"]
hid-buttons = ["hidapi==0.15.0; sys_platform == 'win32'"]
keyword = ["numpy>=1.26", "sherpa-onnx==1.13.8", "sherpa-onnx-core==1.13.8", "onnxruntime==1.31.0", "kaldi-native-fbank==1.22.3"]
camera = ["aiohttp>=3.14,<4", "pillow>=12,<13", "PyYAML>=6,<7", "imageio-ffmpeg==0.6.0"]
memory = [
    "fastembed==0.9.0",
    "fastmcp==4.0.0b1",
    "mcp==2.3.0",
    "mem0ai==1.0.11",
]
dev = ["ruff==0.14.0", "mypy==1.18.2", "setuptools==84.0.0"]

[project.scripts]
pa = "assistant_runtime.app.cli:main"

[tool.setuptools.data-files]
"share/personal-agent/pi" = ["deploy/pi/package.json", "deploy/pi/package-lock.json"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["assistant_runtime.plugins.ai_passport.firmware*", "*.ui", "*.ui.*", "*.management", "*.management.*"]

[tool.setuptools.dynamic]
version = {file = "src/assistant_runtime/VERSION"}

[tool.setuptools.package-data]
"*" = ["configuration.json", "plugin.json", "management/*", "management/assets/*"]
"assistant_runtime" = ["VERSION", "release.json", "owners.json"]
"assistant_runtime.app" = ["templates/*/*.toml"]
"assistant_runtime.core.configuration" = ["static/*"]
"assistant_runtime.plugins.media" = ["README.md", "skills/*/SKILL.md"]
"assistant_runtime.core.tasks" = ["README.md", "skills/*/SKILL.md"]
"assistant_runtime.core.events" = ["README.md", "skills/*/SKILL.md"]
"assistant_runtime.core.execution" = ["README.md"]
"assistant_runtime.core.conversation" = ["README.md"]
"assistant_runtime.core.cli" = ["README.md"]
"assistant_runtime.core.models" = ["model_catalog.json", "MODELS_DEV_LICENSE.txt", "avatars/*.svg", "avatars/*.json", "avatars/*.txt"]
"assistant_runtime.core.pi" = ["*.ts", "*.mjs"]
"assistant_runtime.platforms" = ["*.mjs"]
"assistant_runtime.plugins" = ["*.plugin.json"]
"assistant_runtime.plugins.keyword" = ["FUNASR_LICENSE.txt"]
"assistant_runtime.plugins.ai_passport" = ["README.md", "docs/*.md", "docs/*.conf"]
"assistant_runtime.plugins.aliyun_speech" = ["README.md"]
"assistant_runtime.core.speech_io" = ["README.md"]
"assistant_runtime.plugins.web" = ["static/*", "static/assets/*"]

[tool.setuptools.exclude-package-data]
"assistant_runtime.plugins.ai_passport" = ["firmware/*", "firmware/**/*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src/assistant_runtime/kernel"]

[tool.uv]
prerelease = "allow"
# Non-editable installs must rebuild when code or bundled resources change.
cache-keys = [
    { file = "src/assistant_runtime/VERSION" },
    { file = "pyproject.toml" },
    { file = "deploy/pi/package*.json" },
    { file = "src/**/*.py" },
    { file = "src/**/*.toml" },
    { file = "src/**/*.json" },
    { file = "src/assistant_runtime/core/configuration/static/*" },
    { file = "src/**/management/**/*" },
    { file = "src/**/*.md" },
    { file = "src/**/*.ts" },
    { file = "src/**/*.mjs" },
    { file = "src/**/*.txt" },
    { file = "src/assistant_runtime/plugins/web/static/**/*" },
]
